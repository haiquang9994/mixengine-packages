name: build memcached

# Asked for, never automatic — the same rule every other workflow here keeps.
#
# The shape is `build-redis.yml`'s except on one leg, and that leg is the difference between the two
# rows: **memcached's `windows/x86_64` cell is built, and Redis's is not.** It is built with Cygwin's
# toolchain, on this recipe's own configure line, with nothing patched — the reason the cell was
# empty before ("a privilege-dropping source file for every Unix and none for Windows") described
# the source tree correctly and concluded the wrong thing, since every `*_priv.c` sits behind an
# `AM_CONDITIONAL` and is off by default. `windows/aarch64` is still empty and still exits 75:
# Cygwin has no aarch64 port, and the x86_64 image under emulation is not something this repository
# publishes under an `arch: aarch64` manifest.
#
# **Cygwin is installed with `add-to-path: false`, and that is load-bearing.** On PATH it makes
# `shell: bash` resolve to Cygwin's bash, which hands the trailing CR of a CRLF step script to the
# command; the usual answer is `SHELLOPTS: igncr`, and `SHELLOPTS` is an exported, readonly,
# self-updating variable — so `set -euo pipefail` in the step writes `errexit:nounset` into the
# environment of everything it starts, and an autoconf `configure` is safe under neither. Kept off
# PATH, the step stays git-bash and `tools/memcached.py` reaches Cygwin by absolute path instead,
# through the `root` the install action reports.
#
# GH_TOKEN is set on the pack job and is not on Redis's, which is the one real difference: memcached
# publishes no GitHub releases at all, so its *tags* are the catalogue, and the API that lists them
# limits unauthenticated requests to sixty an hour per IP address — which runners share.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "memcached line (1.6), exact version (1.6.45), or 'latest'. 1.6 and up; Windows ARM has no Cygwin to build with."
        required: true
        type: string
      release:
        description: 'Publish as a GitHub release. Off means build and keep the artifacts for inspection only.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  pack:
    # Linux on 22.04 for the compatibility floor, as in every built row here — see the comment in
    # `build-redis.yml`. `relocate.floor` measures what the artifact actually ended up needing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     os: linux,   arch: x86_64 }
          - { runner: ubuntu-22.04-arm, os: linux,   arch: aarch64 }
          - { runner: macos-14,         os: macos,   arch: aarch64 }
          - { runner: macos-15-intel,   os: macos,   arch: x86_64 }
          - { runner: windows-2022,     os: windows, arch: x86_64 }
          - { runner: windows-11-arm,   os: windows, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: cygwin/cygwin-install-action@master
        id: cygwin
        # One cell out of six. The aarch64 Windows leg deliberately gets no toolchain: there is no
        # Cygwin for it to be given, and the recipe exits 75 there before it would look for one.
        if: matrix.os == 'windows' && matrix.arch == 'x86_64'
        with:
          # The toolchain and nothing more. `gcc-core` is the C compiler without the C++ front end,
          # which neither tarball needs; everything else the recipe does — fetching, hashing,
          # unpacking, running the cache — is Python's and the runner's own.
          packages: make gcc-core pkg-config
          # See the header: on PATH this quietly changes what `shell: bash` means for every step in
          # the job, and the failure it produces names a line inside a generated `configure`.
          add-to-path: false
      - name: build and pack
        id: pack
        # bash on every leg, Windows included, so the exit code is read the same way everywhere. On
        # the Cygwin leg this is still *git*-bash, by the arrangement above.
        # 75 is "there is no build for this target" — permanent here, not a missing version.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Where the step above put Cygwin, asked of it rather than pinned here — and an empty
          # string on the five legs that skipped it, which `memcached.py` reads as "not set".
          CYGWIN_ROOT: ${{ steps.cygwin.outputs.root }}
        run: |
          code=0
          python -u tools/memcached.py --version "${{ inputs.version }}" --out dist || code=$?
          if [ "$code" -eq 75 ]; then
            echo "::notice::no memcached for ${{ matrix.os }}/${{ matrix.arch }}; there is no toolchain that builds it natively for this target"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"
        # A libevent and a memcached, both small. The ceiling is here to catch a build that has
        # stopped rather than one that is slow — and it is 60 rather than 45 because of the one leg
        # that is slow for a structural reason: every `configure` test under Cygwin is a process
        # spawn, and Cygwin emulates `fork` on an operating system that does not have one.
        timeout-minutes: 60
      - uses: actions/upload-artifact@v4
        if: steps.pack.outputs.skipped != 'true'
        with:
          name: memcached-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: pack
    if: ${{ inputs.release && !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: incoming, merge-multiple: true }
      - name: publish one release per version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          versions=$(jq -r '.version' incoming/*.json | sort -u)
          for version in $versions; do
            tag="memcached-$version"
            assets=()
            for manifest in incoming/*.json; do
              [ "$(jq -r '.version' "$manifest")" = "$version" ] || continue
              assets+=("${manifest%.json}" "$manifest")
            done
            echo "== $tag: ${#assets[@]} artifact(s)"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" \
                --title "memcached $version" \
                --notes "Relocatable memcached $version for MixEngine, compiled from upstream's own source release against the SHA-1 published beside it at memcached.org. Five cells: macOS and Linux on both architectures, and Windows on x86_64. libevent 2.1.13-stable is compiled in statically and its licence ships beside memcached's; TLS, SASL, the proxy and the shutdown command are all off. On macOS and Linux that makes the archive one binary that imports nothing outside the C runtime. The Windows archive is two files: upstream has no native Win32 build system, so it is built with Cygwin's toolchain on the same configure line with nothing patched, and cygwin1.dll travels beside the binary — it is LGPLv3, its text ships in licenses/ and licenses/CYGWIN-SOURCE.txt names where its source is published. There is no Windows aarch64 artifact: Cygwin has no aarch64 port, and the x86_64 image runs there only under emulation, which this repository does not publish under an aarch64 manifest. Every artifact was run as a cache from a directory it had been moved to before being published — started on a free loopback port with nothing of the build environment on PATH, answering version over the text protocol, a key stored and read back, and stopped the way the supervisor stops it — see mixengine-artifact.json inside each one for what was proven."
            fi
            gh release upload "$tag" "${assets[@]}" --clobber
          done
