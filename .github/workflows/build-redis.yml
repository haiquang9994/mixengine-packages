name: build redis

# Asked for, never automatic — the same rule every other workflow here keeps, for the same reason:
# upstream releases on its own schedule and a human decides which version is wanted.
#
# **One job for six targets, and one of them exists only to say it is empty.** Redis is a POSIX
# program with no project file of any kind, which P8 read as "no Windows cells" and which is only
# half the finding: compiled *against* a POSIX runtime rather than ported to Win32, the unmodified
# upstream tarball builds and runs. So windows/x86_64 installs Cygwin and packs like any other
# cell, and windows/aarch64 exits 75 because neither Cygwin nor MSYS2 has an ARM64 build and an
# artifact labelled aarch64 may not hold x86_64 binaries. Running the empty leg costs a runner
# minute and buys what an omission cannot: the cell is stated in every run's log.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Redis line (8, 8.10), exact version (8.10.0), or 'latest'. 7.2 and up; Windows has no upstream build."
        required: true
        type: string
      release:
        description: 'Publish as a GitHub release. Off means build and keep the artifacts for inspection only.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  pack:
    # Every leg runs on the operating system and architecture it packs for, and here that is not
    # merely the smoke test's requirement — it is a compiler's. Nothing is cross-built.
    #
    # Linux on 22.04 rather than the newest image, for the reason the MariaDB matrix states: a glibc
    # build only runs on a glibc at least as new as the one that produced it, so the runner choice
    # *is* the compatibility floor. 24.04 measures out at 2.38 and excludes Debian 12; 22.04 puts it
    # at 2.35 and costs nothing. `relocate.floor` measures whatever it actually turns out to be and
    # writes it into the manifest, so this comment is the intent and the artifact is the record.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     os: linux,   arch: x86_64 }
          - { runner: ubuntu-22.04-arm, os: linux,   arch: aarch64 }
          - { runner: macos-14,         os: macos,   arch: aarch64 }
          - { runner: macos-15-intel,   os: macos,   arch: x86_64 }
          - { runner: windows-2022,     os: windows, arch: x86_64 }
          - { runner: windows-11-arm,   os: windows, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # The POSIX runtime the source is compiled against. Only on the x86_64 Windows leg: the ARM
      # one has no Cygwin to install, which is the whole reason it exits 75.
      - uses: cygwin/cygwin-install-action@master
        id: cygwin
        if: matrix.os == 'windows' && matrix.arch == 'x86_64'
        with:
          # `pkg-config` is what `src/Makefile` probes libsystemd with — absent, the probe errors
          # rather than answering no. `gcc-g++` is what the spike installed and therefore what the
          # build has actually been measured with; whether any dependency needs the C++ front end
          # has not been tested, and a package list is not the place to find out.
          packages: make gcc-core gcc-g++ pkg-config
          # **Load-bearing, and `build-memcached.yml` found it first.** On PATH, Cygwin's bash wins
          # over Git for Windows and `shell: bash` silently changes meaning for every later step —
          # which then chokes on the CRLF that Actions writes into each step script, reporting
          # `syntax error: unexpected end of file` about a `fi`. The usual answer, `SHELLOPTS:
          # igncr`, is worse: SHELLOPTS stays exported and self-updating, so `set -e` in a step
          # writes `errexit:nounset` into the environment of everything it starts — including the
          # `sh -c './mkreleasehdr.sh'` that `src/Makefile:19` runs at parse time, which dies on an
          # unset variable and leaves the build to fail hundreds of objects later on a missing
          # `release.h`. Kept off PATH, the step stays git-bash and `tools/redis.py` reaches Cygwin
          # by absolute path instead.
          add-to-path: false
      - name: build and pack
        id: pack
        # bash on every leg, Windows included, so the exit code is read the same way everywhere
        # rather than in two dialects that could disagree.
        #
        # 75 is "there is no build for this target", which for Redis is now a fact about one cell
        # rather than two: windows/aarch64 has no Cygwin to compile against. Every other non-zero
        # code is real and is passed on. `|| code=$?` rather than reading `$?` on the next line,
        # because `shell: bash` runs with `-e` and a non-zero exit would end the step before
        # anything could look at the code.
        shell: bash
        env:
          # Where the step above put Cygwin, asked of it rather than pinned — the install action
          # chose `D:\cygwin` on this runner, not the `C:\cygwin64` a constant would have guessed.
          # Empty on the five legs that skipped it, which `cygwin_root()` reads as "not set".
          CYGWIN_ROOT: ${{ steps.cygwin.outputs.root }}
        run: |
          code=0
          python -u tools/redis.py --version "${{ inputs.version }}" --out dist || code=$?
          if [ "$code" -eq 75 ]; then
            echo "::notice::no Redis for ${{ matrix.os }}/${{ matrix.arch }}; no POSIX runtime exists there to compile against"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"
        # Generous rather than tight: the core is a few minutes on every runner here, and the whole
        # point of a ceiling is to catch a build that has stopped rather than one that is slow.
        timeout-minutes: 45
      - uses: actions/upload-artifact@v4
        if: steps.pack.outputs.skipped != 'true'
        with:
          name: redis-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    # One release per exact version, holding every artifact of it — the version read back out of
    # each manifest rather than taken from the input, because the input may be a line or `latest`
    # and each leg resolves it against upstream independently.
    needs: pack
    if: ${{ inputs.release && !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: incoming, merge-multiple: true }
      - name: publish one release per version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          versions=$(jq -r '.version' incoming/*.json | sort -u)
          for version in $versions; do
            tag="redis-$version"
            assets=()
            for manifest in incoming/*.json; do
              [ "$(jq -r '.version' "$manifest")" = "$version" ] || continue
              # Both halves: the manifest is what the index generator reads, so a release holding
              # only the archive is one the index cannot be rebuilt from.
              assets+=("${manifest%.json}" "$manifest")
            done
            echo "== $tag: ${#assets[@]} artifact(s)"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" \
                --title "Redis $version" \
                --notes "Relocatable Redis $version for MixEngine, compiled from upstream's own source release against the SHA-256 published in redis/redis-hashes. Five cells: macOS and Linux on both architectures, and Windows on x86_64. Redis is a POSIX program with no project file of any kind, so the Windows artifact is compiled against a POSIX runtime rather than ported — the source is unmodified and Cygwin's cygwin1.dll travels beside the binaries under LGPLv3, with its licence and runtime exception in licenses/. It is a development instance and reads like one: the event loop is select rather than epoll, and maxclients settles lower than on Unix. There is no windows/aarch64 artifact, because neither Cygwin nor MSYS2 has an ARM64 build and an archive labelled aarch64 may not hold x86_64 binaries. Core Redis only: the modules the 8.x tarball vendors are not built, and TLS is off. Every artifact was run as a cache from a directory it had been moved to before being published — started against a rendered redis.conf, answering redis-cli ping, its reported version checked against the archive's, a key written and read back, and the server stopped with redis-cli shutdown — see mixengine-artifact.json inside each one for what was proven."
            fi
            gh release upload "$tag" "${assets[@]}" --clobber
          done

